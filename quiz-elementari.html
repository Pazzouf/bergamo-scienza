<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Il Codice delle Emozioni · Quiz</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Caratteri: Fredoka (titoli, tondo e amichevole) + Nunito (testo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Stile del quiz -->
  <link href="style.css" rel="stylesheet">
</head>

<!-- data-quiz sceglie il set di domande; quiz-young imposta la grafica per i più piccoli -->
<body class="quiz-young" data-quiz="elementari">

  <div class="quiz-app">

    <header class="quiz-header">
      <div class="quiz-brand">
        <span class="dot" id="brandDot" aria-hidden="true"></span>
        <span class="name" id="brandName">Il Codice delle Emozioni</span>
      </div>
      <div class="quiz-progress-info" id="progressInfo">Iniziamo!</div>
      <div class="progress" role="progressbar" aria-label="Avanzamento del quiz">
        <div class="progress-bar" id="progressBar" style="width:0%"></div>
      </div>
    </header>

    <main class="quiz-main">
      <div id="quizCarousel" class="carousel slide"
           data-bs-interval="false" data-bs-wrap="false"
           data-bs-touch="true" data-bs-keyboard="false">
        <div class="carousel-inner" id="carouselInner"></div>
      </div>
    </main>

    <footer>
      <div class="quiz-nav">
        <button type="button" class="nav-btn btn-prev hidden" id="btnPrev">← Indietro</button>
        <button type="button" class="nav-btn btn-next" id="btnNext">Avanti →</button>
        <button type="button" class="nav-btn btn-submit hidden" id="btnSubmit">Invia le risposte</button>
      </div>
      <div class="nav-hint" id="navHint" aria-live="polite"></div>
    </footer>

  </div>

  <!-- Bootstrap JS (serve per lo scorrimento del carosello) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Configurazione (domande + URL) e poi il motore -->
  <script src="quiz-config.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
