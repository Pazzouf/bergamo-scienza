<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Il Codice delle Emozioni</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <style>
    .home {
      min-height: 100svh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      max-width: 560px; margin: 0 auto; padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .home .hero-emoji { font-size: 4.6rem; line-height: 1; }
    .home h1 {
      font-family: var(--font-display); font-weight: 600;
      color: var(--burgundy); font-size: 2.3rem; margin: 12px 0 4px;
    }
    .home .sub { color: var(--ink-soft); font-weight: 700; margin-bottom: 30px; }
    .choice {
      display: block; width: 100%; text-decoration: none;
      border-radius: 26px; padding: 22px 20px; margin-bottom: 16px;
      color: #fff; text-align: left;
      box-shadow: 0 16px 30px -18px rgba(0,0,0,.5);
      transition: transform .12s ease;
    }
    .choice:active { transform: scale(.98); }
    .choice .big { font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; }
    .choice .small { font-weight: 700; opacity: .92; }
    .choice.young { background: var(--crimson); }
    .choice.old   { background: var(--teal); }
    .choice .em { font-size: 1.8rem; margin-right: 8px; }
  </style>
</head>
<body>
  <div class="home">
    <div class="hero-emoji">💡</div>
    <h1>Il Codice delle Emozioni</h1>
    <div class="sub">Scegli il quiz adatto a te</div>

    <a class="choice young" href="quiz-elementari.html">
      <div class="big"><span class="em">🌈</span>Elementari e medie</div>
      <div class="small">Domande semplici sulle emozioni</div>
    </a>

    <a class="choice old" href="quiz-superiori.html">
      <div class="big"><span class="em">🧠</span>Superiori e oltre</div>
      <div class="small">Emozioni, cervello e cultura</div>
    </a>
  </div>
</body>
</html>
